<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Eventos SENAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container py-5">
    <h2 class="text-center mb-5">Categorias de Eventos</h2>
    <div class="row g-4 justify-content-center">

      <!-- Card Administração -->
      <div class="col-10 col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm border-0 text-center" onclick="window.parent.postMessage('abrir-admin', '*')" style="cursor: pointer;">
          <div class="card-body">
            <i class="bi bi-briefcase-fill fs-1 text-danger mb-3"></i>
            <h5 class="card-title">Administração e Gestão</h5>
            <p class="card-text">Clique para ver os cursos da área.</p>
          </div>
        </div>
      </div>

      <!-- Card Alimentos -->
      <div class="col-10 col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm border-0 text-center" onclick="window.parent.postMessage('abrir-alimentos', '*')" style="cursor: pointer;">
          <div class="card-body">
            <i class="bi bi-cup-hot-fill fs-1 text-warning mb-3"></i>
            <h5 class="card-title">Alimentos e Bebidas</h5>
            <p class="card-text">Clique para ver os cursos da área.</p>
          </div>
        </div>
      </div>

      <!-- Card Metalurgia -->
      <div class="col-10 col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm border-0 text-center" onclick="window.parent.postMessage('abrir-metalurgia', '*')" style="cursor: pointer;">
          <div class="card-body">
            <i class="bi bi-tools fs-1 text-secondary mb-3"></i>
            <h5 class="card-title">Metalurgia e Soldagem</h5>
            <p class="card-text">Clique para ver os cursos da área.</p>
          </div>
        </div>
      </div>

      <!-- Card TI -->
      <div class="col-10 col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm border-0 text-center" onclick="window.parent.postMessage('abrir-ti', '*')" style="cursor: pointer;">
          <div class="card-body">
            <i class="bi bi-laptop-fill fs-1 text-primary mb-3"></i>
            <h5 class="card-title">Tecnologia da Informação</h5>
            <p class="card-text">Clique para ver os cursos da área.</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/cursos.js"></script>
</body>
</html>

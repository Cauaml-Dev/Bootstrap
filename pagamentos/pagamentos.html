<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pagamento dos Cursos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5">
        <h2 class="text-center mb-4">Cursos Inscritos</h2>

        <ul id="lista-cursos" class="list-group mb-3"></ul>
        <p id="total" class="fw-bold fs-5 text-end"></p>

        <div class="text-center mt-4 d-flex justify-content-center gap-3 flex-wrap">
            <button class="btn btn-danger" onclick="limparInscricoes()">Limpar inscrições</button>
            <button class="btn btn-success" onclick="abrirCheckout()">Confirmar inscrições</button>
        </div>

    </main>

    <!-- Painel de Checkout flutuante -->
    <div class="checkout-overlay d-none" id="checkout"
        style="position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); z-index: 1050; display: flex; justify-content: center; align-items: center;">
        <div class="checkout-panel bg-white p-4 rounded shadow position-relative"
            style="width: 100%; max-width: 400px;">
            <!-- Botão de fechar -->
            <button class="btn-close position-absolute top-0 end-0 m-2" onclick="fecharCheckout()"></button>

            <h3 class="mb-4 text-center">Cursos Inscritos</h3>

            <div id="product-list" class="mb-3"></div>

            <p class="fs-5 fw-bold text-end">Total: R$ <span id="total-value">0,00</span></p>

            <h5 class="mt-4">Forma de pagamento</h5>
            <div class="payment-options mb-4 d-flex justify-content-around">
                <label class="payment-option text-center">
                    <input type="radio" name="pagamento" value="cartao">
                    <img src="../img/cartoes.png" alt="Cartão" width="50">
                    <div>Cartão</div>
                </label>

                <label class="payment-option text-center">
                    <input type="radio" name="pagamento" value="pix">
                    <img src="../img/pix.png" alt="Pix" width="50">
                    <div>Pix</div>
                </label>
            </div>

            <div class="text-center">
                <button class="btn btn-primary" onclick="confirmarInscricao()">Confirmar Inscrição</button>
            </div>
        </div>
    </div>



    <script src="../js/pagamentos.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Alimentos e Bebidas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
  <main class="container py-5 text-center">
    <h2 class="text-warning mb-4">Alimentos e Bebidas</h2>
    <p class="mb-4">Confira nossos cursos presenciais com foco em produção e segurança alimentar.</p>

    <div class="row justify-content-center g-4">

      <!-- Curso 1: Panificação -->
      <div class="col-md-4">
        <img src="../img/pao.jpg" alt="Curso de Panificação" class="curso-img img-fluid rounded shadow" style="max-width: 100%;">
        <div class="mt-3 text-center">
          <button class="btn btn-warning" onclick="mostrarModal('Panificação', '160 horas', '24/07/2023', '21/09/2023', '13h às 17h', 'Massa Caseira — Rua Santos Dumont, 14-71, Vila Lemos', 'R$ 80,00', true)">Ver detalhes</button>
        </div>
      </div>

      <!-- Curso 2: Confeitaria -->
      <div class="col-md-4">
        <img src="../img//confeitaria.jpg" alt="Curso de Confeitaria" class="curso-img rounded shadow" style="max-width: 100%;">
        <div class="mt-3 text-center">
          <button class="btn btn-warning" onclick="mostrarModal('Confeitaria', '120 horas', '02/10/2023', '30/11/2023', '14h às 18h', 'SENAI Bauru — Rua das Rosas, 55', 'R$ 0,00', true)">Ver detalhes</button>
        </div>
      </div>

      <!-- Curso 3: Segurança Alimentar -->
      <div class="col-md-4">
        <img src="../img/seguranca.jpg" alt="Curso de Segurança Alimentar" class="curso-img rounded shadow" style="max-width: 100%;">
        <div class="mt-3 text-center">
          <button class="btn btn-warning" onclick="mostrarModal('Segurança Alimentar', '100 horas', '10/08/2023', '15/09/2023', '08h às 12h', 'SENAI Santo Amaro — Av. Brasil, 1000','R$ 0,00', true)">Ver detalhes</button>
        </div>
      </div>

    </div>

    <!-- Modal dinâmico -->
    <div class="modal fade" id="modalCurso" tabindex="-1" aria-labelledby="modalCursoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h5 class="modal-title" id="modalCursoLabel">Curso</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body text-start">
            <p><strong>Carga horária:</strong> <span id="carga"></span></p>
            <p><strong>Início:</strong> <span id="inicio"></span></p>
            <p><strong>Término:</strong> <span id="termino"></span></p>
            <p><strong>Horário:</strong> <span id="horario"></span></p>
            <p><strong>Local:</strong> <span id="local"></span></p>
            <p><strong>Valor:</strong> <span id="valor"></span></p>
            <p id="descricao">Curso voltado para capacitação profissional na área de alimentos.</p>
            <div class="text-center mt-4" id="botao-pagamento" style="display: none;">
              <a href="../pagamento/pagamento.html" class="btn btn-success">Ir para pagamento</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/eventos.js"></script>
</body>
</html>

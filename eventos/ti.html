<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tecnologia da Informação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
  <main class="container py-5 text-center">
    <h2 class="text-primary mb-4">Tecnologia da Informação</h2>
    <p class="mb-4">Cursos voltados para desenvolvimento, redes, segurança digital e banco de dados.</p>

    <div class="row justify-content-center g-4">

      <!-- Curso 1: Desenvolvimento Web -->
      <div class="col-md-4">
        <img src="../img/web.png" alt="Curso de Desenvolvimento Web" class="curso-img mb-3">
        <div class="text-center">
          <button class="btn btn-primary" onclick="mostrarModal('Desenvolvimento Web', '100 horas', '05/08/2023', '30/09/2023', '18h às 22h', 'SENAI Campinas — Rua da Tecnologia, 101', 'R$ 150,00', true)">Ver detalhes</button>
        </div>
      </div>

      <!-- Curso 2: Redes de Computadores -->
      <div class="col-md-4">
        <img src="../img//rede.jpg" alt="Curso de Redes de Computadores" class="curso-img mb-3">
        <div class="text-center">
          <button class="btn btn-primary" onclick="mostrarModal('Redes de Computadores', '80 horas', '10/09/2023', '20/10/2023', '08h às 12h', 'SENAI São Paulo — Av. Digital, 200', 'R$ 0,00', true)">Ver detalhes</button>
        </div>
      </div>

      <!-- Curso 3: Segurança da Informação -->
      <div class="col-md-4">
        <img src="../img/info.png" alt="Curso de Segurança da Informação" class="curso-img mb-3">
        <div class="text-center">
          <button class="btn btn-primary" onclick="mostrarModal('Segurança da Informação', '60 horas', '01/10/2023', '15/11/2023', '19h às 21h', 'SENAI Online', 'R$ 90,00', true)">Ver detalhes</button>
        </div>
      </div>

    </div>

    <!-- Modal dinâmico -->
    <div class="modal fade" id="modalCurso" tabindex="-1" aria-labelledby="modalCursoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="modalCursoLabel">Curso</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body text-start">
            <p><strong>Carga horária:</strong> <span id="carga"></span></p>
            <p><strong>Início:</strong> <span id="inicio"></span></p>
            <p><strong>Término:</strong> <span id="termino"></span></p>
            <p><strong>Horário:</strong> <span id="horario"></span></p>
            <p><strong>Local:</strong> <span id="local"></span></p>
            <p><strong>Valor:</strong> <span id="valor"></span></p>
            <p id="descricao">Curso voltado para capacitação técnica em desenvolvimento, redes e segurança digital.</p>
            <div class="text-center mt-4" id="botao-pagamento" style="display: none;">
              <a href="../pagamento/pagamento.html" class="btn btn-success">Ir para pagamento</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/eventos.js"></script>
</body>
</html>

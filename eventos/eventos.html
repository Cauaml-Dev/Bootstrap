<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
 
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Eventos SENAI</h2>
      <button class="btn btn-primary" onclick="abrirModal()">Criar Evento</button>
    </div>
 
    <div id="lista-eventos" class="row g-4">
      <!-- Cards de eventos serão inseridos aqui via JS -->
    </div>
  </main>
 
  <!-- Modal Gerenciar Evento -->
  <div class="modal fade" id="modalEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-evento" onsubmit="salvarEvento(event)">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitulo">Gerenciar Evento</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="evento-id">
            <div class="mb-3">
              <label for="evento-nome" class="form-label">Nome do Evento</label>
              <input type="text" class="form-control" id="evento-nome" required>
            </div>
            <div class="mb-3">
              <label for="evento-descricao" class="form-label">Descrição</label>
              <textarea class="form-control" id="evento-descricao" rows="3" required></textarea>
            </div>
          </div>
          <div class="modal-footer d-flex justify-content-between">
            <button type="button" class="btn btn-danger" id="btn-excluir" onclick="excluirEvento()" style="display: none;">Excluir</button>
            <div>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Salvar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/eventos.js"></script>
</body>
</html>
